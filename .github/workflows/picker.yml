name: Picker

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    paths:
      - 'picker/**'
      - '.github/workflows/picker.yml'
  workflow_dispatch:

concurrency:
  group: picker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            dist: dist:linux
            artifact: picker/dist/*.AppImage
          - os: windows-latest
            dist: dist:win
            artifact: picker/dist/*.exe
    defaults:
      run:
        working-directory: picker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: picker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run ${{ matrix.dist }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: picker-${{ matrix.os }}
          path: ${{ matrix.artifact }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
