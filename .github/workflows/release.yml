name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ASSET_NAME: TokaZerkUI-${{ github.ref_name }}.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create release archive
        run: |
          mkdir -p staging/custom
          rsync -a \
            --exclude="*.md" \
            --exclude="*.bak" \
            --exclude=".git" \
            --exclude=".github" \
            --exclude=".gitignore" \
            --exclude="picker" \
            --exclude="_original" \
            --exclude="staging" \
            . staging/custom/
          cd staging
          zip -r "../$ASSET_NAME" custom
          cd ..
          rm -rf staging

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: TokaZerk UI ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ env.ASSET_NAME }}
