name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create ZIP archive
        run: |
          zip -r "TokaZerkUI-${GITHUB_REF_NAME}.zip" . \
            --exclude "*.md" \
            --exclude "*.bak" \
            --exclude ".git/*" \
            --exclude ".github/*"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: TokaZerk UI ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: TokaZerkUI-${{ github.ref_name }}.zip
